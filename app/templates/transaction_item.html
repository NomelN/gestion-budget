<div id="transaction-{{ transaction.id }}"
    class="transaction-item glass-card hover-lift flex items-center justify-between p-5 rounded-2xl mb-3 transition-all new-item-fade-in">
    <div class="flex items-center space-x-4">
        <div
            class="p-3 rounded-xl {% if transaction.type == 'income' %}bg-gradient-to-br from-green-400 to-green-600{% else %}bg-gradient-to-br from-red-400 to-red-600{% endif %} shadow-md">
            <!-- Heroicon: arrow-up for income, arrow-down for expense -->
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                {% if transaction.type == 'income' %}
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m6-6H6" />
                {% else %}
                <path stroke-linecap="round" stroke-linejoin="round" d="M18 12H6" />
                {% endif %}
            </svg>
        </div>
        <div>
            <p class="font-semibold text-gray-800 text-lg">{{ transaction.label }}</p>
            <span
                class="inline-block px-3 py-1 text-xs font-medium rounded-full mt-1 {% if transaction.type == 'income' %}bg-green-100 text-green-700{% else %}bg-red-100 text-red-700{% endif %}">
                {{ transaction.type|capitalize }}
            </span>
        </div>
    </div>
    <div class="flex items-center space-x-4">
        <p
            class="font-bold text-xl {% if transaction.type == 'income' %}text-green-600{% else %}text-red-600{% endif %}">
            {% if transaction.type == 'income' %}+{% else %}-{% endif %}{{ "%.2f"|format(transaction.amount) }} €
        </p>
        <button hx-get="/edit-transaction/{{ transaction.id }}" hx-target="#transaction-{{ transaction.id }}"
            hx-swap="outerHTML"
            class="p-2 text-gray-400 hover:text-purple-600 hover:bg-purple-50 rounded-lg transition-all icon-rotate">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
        </button>
        <button hx-delete="/delete-transaction/{{ transaction.id }}" hx-target="#transaction-{{ transaction.id }}"
            hx-swap="outerHTML swap:0.5s"
            class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all icon-rotate">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
        </button>
    </div>
</div>
